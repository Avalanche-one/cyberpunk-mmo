    <li>
      <a href="{% url "cyberpunk_mmo:faction-list" %}">FACTIONS</a>
    </li>
    <li>
      <a href="{% url "cyberpunk_mmo:specialization-list" %}">SPECIALIZATIONS</a>

    </li>

      <li>
        <a href="{% url 'cyberpunk_mmo:character-list' %}">MY CREW</a>

    <a class="btn" href="{% url 'login' %}">LOGIN</a>

  {% endif %}
