<nav class="site-nav">
  <form class="theme-switcher" method="post" action="{% url 'cyberpunk_mmo:set-theme' %}">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    <button class="button button--compact theme-switcher__button
  {% if request.session.theme != 'phantom' %}
    theme-switcher__button--active
  {% endif %}" name="theme" value="original" type="submit">Original
    </button>
    <button class="button button--compact theme-switcher__button
  {% if request.session.theme == 'phantom' %}
    theme-switcher__button--active
  {% endif %}
" name="theme" value="phantom" type="submit">Phantom
    </button>
  </form>
  <ul class="site-nav__links">
    <li class="site-nav__item">
      <a class="site-nav__link" href="{% url "cyberpunk_mmo:index" %}">HOME</a>
    </li>
    <li class="site-nav__item">
      <a class="site-nav__link" href="{% url "cyberpunk_mmo:faction-list" %}">FACTIONS</a>
    </li>
    <li class="site-nav__item">
      <a class="site-nav__link" href="{% url "cyberpunk_mmo:specialization-list" %}">SPECIALIZATIONS</a>
    </li>
    <li class="site-nav__item">
      <a class="site-nav__link" href="{% url "cyberpunk_mmo:post-list" %}">NEWS</a>
    </li>
    {% if user.is_authenticated %}
      <li class="site-nav__item">
        <a class="site-nav__link" href="{% url 'cyberpunk_mmo:character-list' %}">MY CREW</a>
      </li>
    {% endif %}
  </ul>
  {% if user.is_authenticated %}
    <div class="user-menu">
      <button
          class="user-menu__trigger"
          type="button"
          aria-haspopup="true"
          aria-label="Open profile menu"
      >
        <span class="user-menu__status" aria-hidden="true"></span>
        <span class="user-menu__label">USER // ONLINE</span>
        <span class="user-menu__identity">{% firstof user.first_name user.email user.username %}</span>
        <span class="user-menu__chevron" aria-hidden="true">&#9662;</span>
      </button>
      <div class="user-menu__dropdown">
        <a class="user-menu__action" href="{% url 'user:profile' %}">VIEW PROFILE</a>
        <form class="user-menu__logout" method="post" action="{% url 'user:logout' %}">
          {% csrf_token %}
          <button class="user-menu__action user-menu__action--danger" type="submit">
            LOG OUT
          </button>
        </form>
      </div>
    </div>
  {% else %}
    <a class="button button--compact button--outline" href="{% url 'user:login' %}">LOGIN</a>
    <a class="button button--compact" href="{% url 'user:register' %}">REGISTRATION</a>
  {% endif %}
</nav>
