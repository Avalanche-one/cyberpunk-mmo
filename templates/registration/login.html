{% extends "base.html" %}

{% block content %}
  <h1>Login to your account</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">LOGIN</button>
  </form>
  <p>Don't have an account yet? Then create one!</p>
  <a href="{% url 'cyberpunk_mmo:register' %}">REGISTRATION</a>
{% endblock %}
