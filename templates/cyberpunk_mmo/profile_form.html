{% extends "base.html" %}

{% block content %}
  <h1 class="form-title">Update your information</h1>

  <form class="data-form" method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="button" type="submit">Update</button>
  </form>
  <a class="button button--outline" href="{% url 'cyberpunk_mmo:profile' %}">
    Cancel
  </a>
{% endblock %}
