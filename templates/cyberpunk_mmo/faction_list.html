{% extends "base.html" %}
{% load static %}

{% block content %}
  {% for faction in faction_list %}
    <img src="{% static faction.image_path %}" alt="{{ faction.name }}">
    <h2>{{ faction.name }}</h2>
    <p>{{ faction.description }}</p>
  {% empty %}
    <p>No factions found.</p>
  {% endfor %}
{% endblock %}
