{% extends "base.html" %}
{% load static %}

{% block content %}
  {% for faction in faction_list %}
    <img class="catalog-image" src="{% static faction.image_path %}" alt="{{ faction.name }}">
    <h2 class="catalog-title">{{ faction.name }}</h2>
    <p class="catalog-copy">{{ faction.description }}</p>
  {% empty %}
    <p class="empty-state">No factions found.</p>
  {% endfor %}
{% endblock %}
