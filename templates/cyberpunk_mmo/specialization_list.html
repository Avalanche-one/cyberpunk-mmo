{% extends "base.html" %}
{% load static %}

{% block content %}
  {% for specialization in specialization_list %}
    <img class="catalog-image specialization-image" src="{% static specialization.image_path %}" alt="{{ specialization.name }}">
    <h2 class="catalog-title">{{ specialization.name }}</h2>
    <p class="catalog-copy">{{ specialization.description }}</p>
  {% empty %}
    <p class="empty-state">No specializations found, choom!</p>
  {% endfor %}
{% endblock %}
