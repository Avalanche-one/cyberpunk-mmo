{% extends "base.html" %}

{% block title %}
  <title>Create Specialization</title>
{% endblock %}

{% block content %}
  <h1 class="form-title">Create specialization</h1>

  <form class="data-form" method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <button class="button" type="submit">
      Create specialization
    </button>
  </form>

  <a
      class="button button--outline"
      href="{% url 'cyberpunk_mmo:specialization-list' %}"
  >
    Cancel
  </a>
{% endblock %}
