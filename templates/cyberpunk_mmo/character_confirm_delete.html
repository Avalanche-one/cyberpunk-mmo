{% extends "base.html" %}

{% block content %}
  <h1 class="danger-title">Delete this character?</h1>
  <form class="confirm-form" action="" method="post">
    {% csrf_token %}

    <input class="button button--danger" type="submit" value="Yes">
  </form>
  <a class="button button--outline" href="{% url 'cyberpunk_mmo:character-detail' pk=character.pk %}">
    Cancel
  </a>
{% endblock %}
