{% extends "base.html" %}

{% block content %}
  {% for character in character_list %}
    <h2><a href="{% url 'cyberpunk_mmo:character-detail' pk=character.id %}">{{ character.name }}</a></h2>
    <p>{{ character.level }}</p>
  {% empty %}
    <p>No characters yet! Create your first!</p>
  {% endfor %}
  <a href="{% url 'cyberpunk_mmo:character-create' %}">Create new character</a>
{% endblock %}
